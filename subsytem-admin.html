<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Diagnostic Propriétaire</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f7fa; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔍 Diagnostic – Page Propriétaire</h2>
    <div id="status">Vérification de l'authentification...</div>
    <div id="details" style="display:none;">
        <h3>Informations utilisateur :</h3>
        <pre id="user-info"></pre>
        <h3>Token (20 premiers caractères) :</h3>
        <pre id="token-preview"></pre>
    </div>
    <button id="logout-btn" style="display:none;">Se déconnecter</button>
</div>
<script>
const API_BASE = '';

function log(msg) { console.log('[Diag]', msg); }

async function check() {
    const token = localStorage.getItem('lotato_token');
    const statusDiv = document.getElementById('status');
    const detailsDiv = document.getElementById('details');
    const userInfoPre = document.getElementById('user-info');
    const tokenPreview = document.getElementById('token-preview');
    const logoutBtn = document.getElementById('logout-btn');

    if (!token) {
        statusDiv.className = 'error';
        statusDiv.innerHTML = '❌ Aucun token trouvé dans localStorage. Redirection vers login dans 3 secondes...';
        setTimeout(() => window.location.href = '/index.html', 3000);
        return;
    }

    tokenPreview.textContent = token.substring(0, 20) + '...';
    logoutBtn.style.display = 'block';

    try {
        const res = await fetch('/api/auth/check', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!res.ok) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = `❌ Erreur HTTP ${res.status} lors de /api/auth/check. Redirection...`;
            setTimeout(() => window.location.href = '/index.html', 3000);
            return;
        }

        const data = await res.json();
        log('auth/check response:', data);

        if (!data.success) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = `❌ /api/auth/check a répondu success: false. Message: ${data.error || 'inconnu'}. Redirection...`;
            setTimeout(() => window.location.href = '/index.html', 3000);
            return;
        }

        const user = data.user;
        userInfoPre.textContent = JSON.stringify(user, null, 2);
        detailsDiv.style.display = 'block';

        if (user.role !== 'subsystem') {
            statusDiv.className = 'error';
            statusDiv.innerHTML = `❌ Rôle incorrect : "${user.role}". Attendu : "subsystem". Redirection...`;
            setTimeout(() => window.location.href = '/index.html', 3000);
        } else {
            statusDiv.className = 'success';
            statusDiv.innerHTML = '✅ Authentification réussie ! Vous êtes bien un propriétaire de sous‑système.<br><br>👉 Si cette page s\'affiche correctement, le problème vient du code de l\'interface complète. Sinon, le problème est côté serveur/base de données.';
            // Pas de redirection, on reste sur cette page de diagnostic.
        }

    } catch (error) {
        statusDiv.className = 'error';
        statusDiv.innerHTML = `❌ Erreur réseau : ${error.message}. Redirection...`;
        setTimeout(() => window.location.href = '/index.html', 3000);
    }
}

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.clear();
    window.location.href = '/index.html';
});

check();
</script>
</body>
</html>
