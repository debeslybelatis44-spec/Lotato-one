<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Propriétaire - Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f7fa; }
        .card { background: white; border-radius: 12px; padding: 30px; max-width: 500px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🏢 Espace Propriétaire</h2>
    <div id="status">Vérification de l'authentification...</div>
    <div id="info" style="display:none; margin-top:20px;">
        <p><strong>Nom :</strong> <span id="user-name"></span></p>
        <p><strong>Rôle :</strong> <span id="user-role"></span></p>
        <p><strong>Subsystem ID :</strong> <span id="subsystem-id"></span></p>
    </div>
    <button id="logout">Déconnexion</button>
</div>
<script>
    const API_BASE = '';
    const token = localStorage.getItem('lotato_token');

    if (!token) {
        document.getElementById('status').innerHTML = '<span class="error">❌ Aucun token. Redirection...</span>';
        setTimeout(() => window.location.href = '/index.html', 2000);
    } else {
        fetch('/api/auth/check', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            console.log('Auth check:', data);
            if (!data.success) {
                document.getElementById('status').innerHTML = `<span class="error">❌ Échec: ${data.error}</span>`;
                localStorage.removeItem('lotato_token');
                setTimeout(() => window.location.href = '/index.html', 2000);
            } else {
                const user = data.user;
                if (user.role !== 'subsystem') {
                    document.getElementById('status').innerHTML = `<span class="error">❌ Rôle incorrect: ${user.role} (attendu subsystem)</span>`;
                    setTimeout(() => window.location.href = '/index.html', 3000);
                } else {
                    document.getElementById('status').innerHTML = '<span class="success">✅ Authentification réussie !</span>';
                    document.getElementById('info').style.display = 'block';
                    document.getElementById('user-name').textContent = user.full_name || user.username;
                    document.getElementById('user-role').textContent = user.role;
                    document.getElementById('subsystem-id').textContent = user.subsystem_id || 'Non défini';
                }
            }
        })
        .catch(err => {
            document.getElementById('status').innerHTML = `<span class="error">❌ Erreur réseau: ${err.message}</span>`;
        });
    }

    document.getElementById('logout').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/index.html';
    });
</script>
</body>
</html>
