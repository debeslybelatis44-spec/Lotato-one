<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotato - Superviseur Niveau 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary-color: #f39c12;
            --secondary-color: #2c3e50;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --sidebar-width: 280px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f7fa; display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, #f39c12, #e67e22); color: white; position: fixed; height: 100vh; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .logo-container { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 2.5rem; }
        .logo-text { font-size: 1.4rem; font-weight: bold; }
        .user-info { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .user-avatar { width: 50px; height: 50px; background: white; color: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
        .user-details h3 { font-size: 1rem; }
        .user-details p { font-size: 0.8rem; opacity: 0.8; }
        .nav-menu { padding: 20px 0; }
        .nav-item { display: flex; align-items: center; padding: 15px 25px; color: rgba(255,255,255,0.8); text-decoration: none; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.15); color: white; border-left-color: white; }
        .nav-icon { width: 30px; font-size: 1.2rem; margin-right: 15px; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; margin-bottom: 30px; border-bottom: 1px solid #ddd; }
        .page-title { font-size: 1.8rem; color: var(--secondary-color); }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--primary-color); color: white; }
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; background: var(--primary-color); }
        .stat-value { font-size: 1.8rem; font-weight: bold; }
        .table-container { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .notification { position: fixed; top: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; color: white; z-index: 3000; animation: slideIn 0.3s; }
        .notification.success { background: var(--success-color); }
        .notification.error { background: var(--danger-color); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 1024px) { .sidebar { width: 70px; } .logo-text, .user-details, .nav-label { display: none; } .main-content { margin-left: 70px; } }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo-container"><div class="logo"><i class="fas fa-user-tie"></i></div><div class="logo-text">SUPERVISEUR 1</div></div>
    <div class="user-info"><div class="user-avatar" id="user-avatar">S1</div><div class="user-details"><h3 id="user-name">Chargement...</h3><p id="user-role-display">Superviseur Niveau 1</p></div></div>
    <div class="nav-menu">
        <a href="#" class="nav-item active" data-section="dashboard"><div class="nav-icon"><i class="fas fa-tachometer-alt"></i></div><div class="nav-label">Tableau de bord</div></a>
        <a href="#" class="nav-item" data-section="agents"><div class="nav-icon"><i class="fas fa-users"></i></div><div class="nav-label">Mes Agents</div></a>
        <a href="#" class="nav-item" data-section="tickets"><div class="nav-icon"><i class="fas fa-ticket-alt"></i></div><div class="nav-label">Tickets</div></a>
        <a href="#" class="nav-item" data-section="reports"><div class="nav-icon"><i class="fas fa-chart-bar"></i></div><div class="nav-label">Rapports</div></a>
    </div>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="page-title"><i class="fas fa-tachometer-alt"></i> <span id="page-title">Tableau de bord</span></div>
        <div><button class="btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button></div>
    </div>

    <div id="dashboard-section" class="section-content active">
        <div class="stats-cards">
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div><div class="stat-value" id="total-agents">0</div><div>Agents assignés</div></div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-ticket-alt"></i></div><div><div class="stat-value" id="today-tickets">0</div><div>Tickets aujourd'hui</div></div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div><div class="stat-value" id="today-sales">0 HTG</div><div>Ventes aujourd'hui</div></div></div>
        </div>
        <div class="table-container"><h3>Activité récente</h3><div id="recent-activity">Chargement...</div></div>
    </div>

    <div id="agents-section" class="section-content" style="display:none;"><div class="table-container"><h3>Mes Agents</h3><div id="agents-list"></div></div></div>
    <div id="tickets-section" class="section-content" style="display:none;"><div class="table-container"><h3>Tickets du jour</h3><div id="tickets-list"></div></div></div>
    <div id="reports-section" class="section-content" style="display:none;"><div class="table-container"><h3>Rapport</h3><button class="btn" id="generate-simple-report">Générer rapport journalier</button><div id="report-result"></div></div></div>
</div>

<div id="notification-container"></div>

<script>
const API_BASE = '';
let currentUser = null;
let agents = [];

function showNotification(msg, type='info') {
    const c = document.getElementById('notification-container');
    const n = document.createElement('div');
    n.className = `notification ${type}`;
    n.innerHTML = `<i class="fas fa-${type==='success'?'check':type==='error'?'times':'info'}-circle"></i><span>${msg}</span>`;
    c.appendChild(n); setTimeout(() => n.remove(), 5000);
}

async function apiCall(url, method='GET', body=null) {
    const token = localStorage.getItem('lotato_token');
    if (!token) { logout(); throw new Error('No token'); }
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    const options = { method, headers }; if (body) options.body = JSON.stringify(body);
    const res = await fetch(url, options);
    if (res.status === 401) { logout(); return null; }
    return await res.json();
}

function logout() { localStorage.clear(); window.location.href = '/index.html'; }

async function loadDashboard() {
    const userRes = await apiCall('/api/auth/check');
    if (!userRes?.success) { logout(); return; }
    currentUser = userRes.user;

    // Vérification STRICTE : superviseur niveau 1 uniquement
    if (currentUser.role !== 'supervisor' || currentUser.level !== 1) {
        showNotification('Accès réservé aux superviseurs niveau 1', 'error');
        setTimeout(logout, 2000);
        return;
    }

    document.getElementById('user-name').textContent = currentUser.full_name || currentUser.username;
    document.getElementById('user-avatar').textContent = (currentUser.full_name || 'S1').charAt(0).toUpperCase();

    // Charger les agents assignés à ce superviseur (supervisor_id = currentUser.id)
    const usersRes = await apiCall('/api/subsystem/users');
    if (usersRes?.success) {
        agents = usersRes.users.filter(u => u.role === 'agent' && u.supervisor_id === currentUser.id);
        document.getElementById('total-agents').textContent = agents.length;

        // Calculer tickets et ventes du jour pour ces agents
        const ticketsRes = await apiCall('/api/tickets');
        if (ticketsRes?.success) {
            const today = new Date().toISOString().split('T')[0];
            const agentIds = agents.map(a => a.id);
            const todayTickets = ticketsRes.tickets.filter(t => agentIds.includes(t.agent_id) && t.created_at?.startsWith(today));
            const totalTickets = todayTickets.length;
            const totalSales = todayTickets.reduce((s,t) => s + t.total_amount, 0);
            document.getElementById('today-tickets').textContent = totalTickets;
            document.getElementById('today-sales').textContent = totalSales.toLocaleString() + ' HTG';
            document.getElementById('recent-activity').innerHTML = totalTickets ? todayTickets.slice(0,5).map(t => `<div>${t.ticket_number} - ${t.total_amount} HTG (${t.agent_name})</div>`).join('') : '<p>Aucune activité</p>';
        }
    }
}

async function loadAgentsList() {
    const container = document.getElementById('agents-list');
    if (!agents.length) { container.innerHTML = '<p>Aucun agent assigné.</p>'; return; }
    let html = '<table style="width:100%;border-collapse:collapse;">';
    html += '<tr><th>Nom</th><th>Statut</th><th>Ventes jour</th></tr>';
    for (const a of agents) {
        const ticketsRes = await apiCall(`/api/tickets?agent_id=${a.id}`);
        const today = new Date().toISOString().split('T')[0];
        const todaySales = ticketsRes?.success ? ticketsRes.tickets.filter(t => t.created_at?.startsWith(today)).reduce((s,t) => s + t.total_amount, 0) : 0;
        html += `<tr><td>${a.full_name}</td><td>${a.is_active ? 'Actif' : 'Inactif'}</td><td>${todaySales} HTG</td></tr>`;
    }
    html += '</table>';
    container.innerHTML = html;
}

async function loadTicketsList() {
    const container = document.getElementById('tickets-list');
    const ticketsRes = await apiCall('/api/tickets');
    if (!ticketsRes?.success) { container.innerHTML = '<p>Erreur de chargement</p>'; return; }
    const today = new Date().toISOString().split('T')[0];
    const agentIds = agents.map(a => a.id);
    const todayTickets = ticketsRes.tickets.filter(t => agentIds.includes(t.agent_id) && t.created_at?.startsWith(today));
    container.innerHTML = todayTickets.length ? todayTickets.map(t => `<div>${t.ticket_number} - ${t.total_amount} HTG (${t.agent_name})</div>`).join('') : '<p>Aucun ticket aujourd\'hui</p>';
}

function showSection(section) {
    document.querySelectorAll('.section-content').forEach(s => s.style.display = 'none');
    document.getElementById(section + '-section').style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelector(`.nav-item[data-section="${section}"]`).classList.add('active');
    if (section === 'agents') loadAgentsList();
    else if (section === 'tickets') loadTicketsList();
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadDashboard();

    document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', e => {
        e.preventDefault();
        showSection(i.dataset.section);
    }));

    document.getElementById('logout-btn').addEventListener('click', logout);

    document.getElementById('generate-simple-report').addEventListener('click', async () => {
        const ticketsRes = await apiCall('/api/tickets');
        const total = ticketsRes?.success ? ticketsRes.tickets.reduce((s,t) => s + t.total_amount, 0) : 0;
        document.getElementById('report-result').innerHTML = `<p>Total ventes (tous agents): ${total} HTG</p>`;
    });
});
</script>
</body>
</html>
