<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotato — Superviseur Niveau 1</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --brand:#f39c12; --brand2:#e67e22; --success:#27ae60; --danger:#e74c3c; --info:#3498db; --bg:#f5f7fa; --sidebar:260px; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); display:flex; min-height:100vh; color:#2c3e50; }

    /* ── Sidebar ── */
    .sidebar { width:var(--sidebar); background:linear-gradient(180deg,#7a4800,#3d2400); color:#e2e8f0; position:fixed; height:100vh; overflow-y:auto; display:flex; flex-direction:column; z-index:50; }
    .sb-brand { padding:22px 18px; text-align:center; border-bottom:1px solid rgba(255,255,255,.1); }
    .sb-brand .icon { font-size:1.9rem; color:var(--brand); }
    .sb-brand h2 { font-size:1.1rem; font-weight:800; margin-top:5px; }
    .sb-brand small { font-size:.72rem; color:#a78345; }
    .sb-user { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.1); }
    .sb-avatar { width:40px; height:40px; background:var(--brand); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; color:white; flex-shrink:0; }
    .sb-user .info h4 { font-size:.88rem; color:white; }
    .sb-user .info p  { font-size:.72rem; color:#a78345; }
    .sb-nav { flex:1; padding:10px 0; }
    .sb-nav a { display:flex; align-items:center; gap:12px; padding:13px 20px; color:#c4a46b; text-decoration:none; border-left:3px solid transparent; font-size:.88rem; transition:.2s; }
    .sb-nav a:hover, .sb-nav a.active { background:rgba(255,255,255,.08); color:white; border-left-color:var(--brand); }
    .sb-nav a i { width:18px; text-align:center; }
    .sb-foot { padding:14px 18px; }
    .btn-logout { width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:white; padding:9px; border-radius:7px; cursor:pointer; font-size:.84rem; transition:.2s; }
    .btn-logout:hover { background:rgba(231,76,60,.3); }

    /* ── Main ── */
    .main { flex:1; margin-left:var(--sidebar); padding:24px 28px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .topbar h1 { font-size:1.4rem; display:flex; align-items:center; gap:10px; }
    .topbar h1 i { color:var(--brand); }

    /* ── Boutons ── */
    .btn { padding:9px 18px; border:none; border-radius:8px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-size:.88rem; transition:.2s; }
    .btn:hover { opacity:.87; }
    .btn-primary { background:var(--brand); color:white; }
    .btn-sm { padding:5px 12px; font-size:.78rem; }

    /* ── Stats ── */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:22px; }
    .stat-card { background:white; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.07); display:flex; align-items:center; gap:14px; }
    .stat-icon { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:white; flex-shrink:0; }
    .stat-value { font-size:1.6rem; font-weight:800; }
    .stat-label { font-size:.8rem; color:#64748b; margin-top:2px; }

    /* ── Panel ── */
    .panel { background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:20px; }
    .panel-title { font-size:1rem; font-weight:700; margin-bottom:16px; }
    .section { display:none; }
    .section.active { display:block; }

    /* ── Table ── */
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #f0f4f8; font-size:.87rem; }
    th { font-weight:700; color:#475569; background:#f8fafc; }
    tr:hover td { background:#fafafa; }
    .badge { padding:3px 9px; border-radius:20px; font-size:.72rem; font-weight:700; }
    .badge-active   { background:#d1fae5; color:#065f46; }
    .badge-inactive { background:#fee2e2; color:#991b1b; }
    .badge-online   { background:#dbeafe; color:#1e40af; }

    /* ── Toast ── */
    #toast-container { position:fixed; top:16px; right:16px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:10px 15px; border-radius:9px; color:white; display:flex; align-items:center; gap:8px; font-size:.87rem; box-shadow:0 4px 12px rgba(0,0,0,.2); animation:si .3s; }
    .toast.success { background:var(--success); }
    .toast.error   { background:var(--danger); }
    .toast.info    { background:var(--info); }
    @keyframes si { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }

    .empty { text-align:center; padding:32px; color:#94a3b8; }
    .empty i { font-size:2rem; margin-bottom:10px; }

    @media(max-width:1024px){ .sidebar{width:62px;} .sb-brand h2,.sb-brand small,.sb-user .info,.sb-nav a span,.sb-foot span{display:none;} .sb-nav a{justify-content:center;padding:13px;} .main{margin-left:62px;} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <div class="icon"><i class="fas fa-user-tie"></i></div>
    <h2>SUPERVISEUR N1</h2>
    <small>Niveau 1</small>
  </div>
  <div class="sb-user">
    <div class="sb-avatar" id="sbAvatar">S</div>
    <div class="info">
      <h4 id="sbName">Chargement…</h4>
      <p>Superviseur Niveau 1</p>
    </div>
  </div>
  <nav class="sb-nav">
    <a href="#" class="active" data-sec="dashboard"><i class="fas fa-tachometer-alt"></i><span>Tableau de bord</span></a>
    <a href="#" data-sec="agents"><i class="fas fa-users"></i><span>Mes Agents</span></a>
    <a href="#" data-sec="tickets"><i class="fas fa-ticket-alt"></i><span>Tickets</span></a>
    <a href="#" data-sec="report"><i class="fas fa-chart-bar"></i><span>Rapport journalier</span></a>
  </nav>
  <div class="sb-foot">
    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Déconnexion</span></button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h1><i class="fas fa-tachometer-alt" id="secIcon"></i><span id="secTitle">Tableau de bord</span></h1>
    <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Actualiser</button>
  </div>

  <!-- Dashboard -->
  <div class="section active" id="sec-dashboard">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#f39c12,#e67e22)"><i class="fas fa-users"></i></div><div><div class="stat-value" id="dAgents">0</div><div class="stat-label">Agents assignés</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7)"><i class="fas fa-user-check"></i></div><div><div class="stat-value" id="dOnline">0</div><div class="stat-label">Agents en ligne</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#667eea,#764ba2)"><i class="fas fa-ticket-alt"></i></div><div><div class="stat-value" id="dTickets">0</div><div class="stat-label">Tickets aujourd'hui</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"><i class="fas fa-money-bill-wave"></i></div><div><div class="stat-value" id="dSales">0</div><div class="stat-label">Ventes (HTG)</div></div></div>
    </div>
    <div class="panel">
      <div class="panel-title"><i class="fas fa-history"></i> Activité récente</div>
      <div id="recentActivity"></div>
    </div>
  </div>

  <!-- Agents -->
  <div class="section" id="sec-agents">
    <div class="panel">
      <div class="panel-title"><i class="fas fa-users"></i> Mes Agents</div>
      <div id="agentsList"></div>
    </div>
  </div>

  <!-- Tickets -->
  <div class="section" id="sec-tickets">
    <div class="panel">
      <div class="panel-title"><i class="fas fa-ticket-alt"></i> Tickets du jour</div>
      <div id="ticketsList"></div>
    </div>
  </div>

  <!-- Rapport -->
  <div class="section" id="sec-report">
    <div class="panel">
      <div class="panel-title"><i class="fas fa-chart-bar"></i> Rapport journalier</div>
      <button class="btn btn-primary" id="genReportBtn"><i class="fas fa-sync-alt"></i> Générer le rapport</button>
      <div id="reportContent" style="margin-top:18px"></div>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<script>
(function () {
  'use strict';

  const token = localStorage.getItem('lotato_token');
  if (!token) { window.location.href = '/index.html'; }

  const $ = id => document.getElementById(id);
  let currentUser = null;
  let myAgents    = [];   // agents de ce superviseur

  // ── Helpers ──────────────────────────────────────────────────
  function toast(msg, type = 'info') {
    const c = $('toast-container');
    const t = document.createElement('div');
    const icons = { success:'check-circle', error:'times-circle', info:'info-circle' };
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 5000);
  }

  async function api(url, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` } };
    if (body) opts.body = JSON.stringify(body);
    try {
      const res = await fetch(url, opts);
      if (res.status === 401) { logout(); return null; }
      return await res.json();
    } catch { toast('Erreur réseau', 'error'); return null; }
  }

  function logout() { localStorage.clear(); window.location.href = '/index.html'; }

  function today() { return new Date().toISOString().split('T')[0]; }

  // ── Navigation ────────────────────────────────────────────────
  const sectionMeta = {
    dashboard: { title:'Tableau de bord', icon:'fa-tachometer-alt' },
    agents:    { title:'Mes Agents',       icon:'fa-users' },
    tickets:   { title:'Tickets du jour',  icon:'fa-ticket-alt' },
    report:    { title:'Rapport journalier', icon:'fa-chart-bar' }
  };

  function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.sb-nav a').forEach(a => a.classList.remove('active'));
    $(`sec-${name}`).classList.add('active');
    document.querySelector(`.sb-nav a[data-sec="${name}"]`)?.classList.add('active');
    const m = sectionMeta[name];
    $('secTitle').textContent = m.title;
    $('secIcon').className    = `fas ${m.icon}`;
    if (name === 'agents')  loadAgents();
    if (name === 'tickets') loadTickets();
    if (name === 'report')  { $('reportContent').innerHTML = ''; }
  }

  document.querySelectorAll('.sb-nav a[data-sec]').forEach(a =>
    a.addEventListener('click', e => { e.preventDefault(); showSection(a.dataset.sec); })
  );

  // ── Utilitaire : filtrer les tickets de mes agents ────────────
  // Le serveur populé supervisor_id → on compare par _id (string) OU supervisor_id direct
  function isMyAgent(user) {
    if (!currentUser) return false;
    const supId = user.supervisor_id;
    if (!supId) return false;
    // supId peut être un objet populé { _id, full_name } ou une simple string
    const supIdStr = (typeof supId === 'object' ? supId._id : supId)?.toString();
    return supIdStr === currentUser.id?.toString() || supIdStr === currentUser._id?.toString();
  }

  function filterAgentTickets(tickets) {
    const agentIds = myAgents.map(a => (a._id || a.id).toString());
    return tickets.filter(t => {
      const agentId = t.agent_id?._id?.toString() || t.agent_id?.toString();
      return agentIds.includes(agentId);
    });
  }

  // ── Dashboard ─────────────────────────────────────────────────
  async function loadDashboard() {
    const [usersRes, ticketsRes] = await Promise.all([
      api('/api/subsystem/users'),
      api('/api/tickets')
    ]);

    if (usersRes?.success) {
      myAgents = usersRes.users.filter(isMyAgent);
      $('dAgents').textContent = myAgents.length;
      $('dOnline').textContent = myAgents.filter(a => a.is_online).length;
    }

    if (ticketsRes?.success) {
      const todayTickets = filterAgentTickets(ticketsRes.tickets)
        .filter(t => (t.created_at || '').startsWith(today()));
      const totalSales = todayTickets.reduce((s, t) => s + (t.total_amount || 0), 0);
      $('dTickets').textContent = todayTickets.length;
      $('dSales').textContent   = totalSales.toLocaleString();

      $('recentActivity').innerHTML = todayTickets.length
        ? `<table><thead><tr><th>#Ticket</th><th>Agent</th><th>Tirage</th><th>Total (HTG)</th><th>Heure</th></tr></thead><tbody>
            ${todayTickets.slice(0, 8).map(t => `<tr>
              <td><code>${t.ticket_number}</code></td>
              <td>${t.agent_name || '—'}</td>
              <td>${t.draw} (${t.draw_time === 'morning' ? 'Maten' : 'Swè'})</td>
              <td><strong>${(t.total_amount||0).toLocaleString()}</strong></td>
              <td>${new Date(t.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td>
            </tr>`).join('')}
          </tbody></table>`
        : '<div class="empty"><i class="fas fa-receipt"></i><p>Aucune activité aujourd\'hui</p></div>';
    }
  }

  // ── Agents ────────────────────────────────────────────────────
  async function loadAgents() {
    const [usersRes, ticketsRes] = await Promise.all([
      api('/api/subsystem/users'),
      api('/api/tickets')
    ]);
    if (!usersRes?.success) return;

    myAgents = usersRes.users.filter(isMyAgent);

    const todayTkts = ticketsRes?.success ? filterAgentTickets(ticketsRes.tickets).filter(t => (t.created_at || '').startsWith(today())) : [];

    $('agentsList').innerHTML = myAgents.length
      ? `<table><thead><tr><th>Nom</th><th>Identifiant</th><th>Statut</th><th>En ligne</th><th>Tickets aujourd'hui</th><th>Ventes (HTG)</th></tr></thead><tbody>
          ${myAgents.map(a => {
            const aId = (a._id || a.id).toString();
            const aTkts = todayTkts.filter(t => (t.agent_id?._id?.toString() || t.agent_id?.toString()) === aId);
            const aSales = aTkts.reduce((s, t) => s + (t.total_amount || 0), 0);
            return `<tr>
              <td><strong>${a.full_name || a.username}</strong></td>
              <td><code>${a.username}</code></td>
              <td><span class="badge ${a.is_active ? 'badge-active' : 'badge-inactive'}">${a.is_active ? 'Actif' : 'Inactif'}</span></td>
              <td>${a.is_online ? '<span class="badge badge-online"><i class="fas fa-circle" style="font-size:.5rem"></i> En ligne</span>' : '<span style="color:#94a3b8;font-size:.82rem">Hors ligne</span>'}</td>
              <td>${aTkts.length}</td>
              <td><strong>${aSales.toLocaleString()}</strong></td>
            </tr>`;
          }).join('')}
        </tbody></table>`
      : '<div class="empty"><i class="fas fa-users"></i><p>Aucun agent assigné à votre supervision</p></div>';
  }

  // ── Tickets ───────────────────────────────────────────────────
  async function loadTickets() {
    const [usersRes, ticketsRes] = await Promise.all([
      api('/api/subsystem/users'),
      api('/api/tickets')
    ]);
    if (!usersRes?.success || !ticketsRes?.success) return;

    myAgents = usersRes.users.filter(isMyAgent);
    const todayTkts = filterAgentTickets(ticketsRes.tickets).filter(t => (t.created_at || '').startsWith(today()));

    $('ticketsList').innerHTML = todayTkts.length
      ? `<table><thead><tr><th>#Ticket</th><th>Agent</th><th>Tirage</th><th>Séance</th><th>Total (HTG)</th><th>Heure</th></tr></thead><tbody>
          ${todayTkts.map(t => `<tr>
            <td><code>${t.ticket_number}</code></td>
            <td>${t.agent_name || '—'}</td>
            <td>${t.draw}</td>
            <td>${t.draw_time === 'morning' ? 'Maten' : 'Swè'}</td>
            <td><strong>${(t.total_amount||0).toLocaleString()}</strong></td>
            <td>${new Date(t.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td>
          </tr>`).join('')}
        </tbody></table>`
      : '<div class="empty"><i class="fas fa-ticket-alt"></i><p>Aucun ticket aujourd\'hui</p></div>';
  }

  // ── Rapport ───────────────────────────────────────────────────
  $('genReportBtn').addEventListener('click', async () => {
    const [usersRes, ticketsRes] = await Promise.all([
      api('/api/subsystem/users'),
      api('/api/tickets')
    ]);
    if (!usersRes?.success || !ticketsRes?.success) return;

    myAgents = usersRes.users.filter(isMyAgent);
    const allMyTickets   = filterAgentTickets(ticketsRes.tickets);
    const todayTickets   = allMyTickets.filter(t => (t.created_at || '').startsWith(today()));
    const totalSales     = allMyTickets.reduce((s, t) => s + (t.total_amount || 0), 0);
    const todaySales     = todayTickets.reduce((s, t) => s + (t.total_amount || 0), 0);

    const agentRows = myAgents.map(a => {
      const aId   = (a._id || a.id).toString();
      const aTkts = todayTickets.filter(t => (t.agent_id?._id?.toString() || t.agent_id?.toString()) === aId);
      const aSales= aTkts.reduce((s, t) => s + (t.total_amount || 0), 0);
      return `<tr><td>${a.full_name || a.username}</td><td>${aTkts.length}</td><td>${aSales.toLocaleString()}</td></tr>`;
    }).join('');

    $('reportContent').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px">
        ${[['Agents sous supervision', myAgents.length,'#f39c12'],['Tickets aujourd\'hui', todayTickets.length,'#667eea'],['Ventes aujourd\'hui (HTG)', todaySales.toLocaleString(),'#43e97b'],['Ventes totales (HTG)', totalSales.toLocaleString(),'#4facfe']]
          .map(([label,val,color]) => `<div style="background:white;border-radius:10px;padding:14px;border-left:4px solid ${color};box-shadow:0 2px 6px rgba(0,0,0,.06)"><div style="font-size:1.5rem;font-weight:800">${val}</div><div style="color:#94a3b8;font-size:.8rem">${label}</div></div>`).join('')}
      </div>
      ${agentRows ? `<div class="panel"><div class="panel-title">Détail par agent (aujourd'hui)</div><table><thead><tr><th>Agent</th><th>Tickets</th><th>Ventes (HTG)</th></tr></thead><tbody>${agentRows}</tbody></table></div>` : ''}
    `;
  });

  // ── Globaux ───────────────────────────────────────────────────
  $('refreshBtn').addEventListener('click', () => {
    loadDashboard();
    toast('Actualisé', 'info');
  });
  $('logoutBtn').addEventListener('click', logout);

  // ── Init ──────────────────────────────────────────────────────
  (async function init() {
    const res = await api('/api/auth/check');
    if (!res?.success || res.user.role !== 'supervisor' || res.user.level !== 1) {
      toast('Accès réservé aux superviseurs niveau 1', 'error');
      setTimeout(logout, 1800);
      return;
    }
    currentUser = res.user;
    $('sbName').textContent   = res.user.full_name || res.user.username;
    $('sbAvatar').textContent = (res.user.full_name || 'S').charAt(0).toUpperCase();
    await loadDashboard();
  })();
})();
</script>
</body>
</html>
