<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Lotato - Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon { font-size: 3.5rem; color: #f39c12; margin-bottom: 10px; }
        .logo h1 { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #f39c12, #e74c3c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #b3c7e5; font-size: 1rem; margin-top: 5px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; color: #e2e8f0; font-weight: 500; }
        .form-group input { width: 100%; padding: 15px 18px; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: #f39c12; background: rgba(255,255,255,0.12); }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .logout-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 12px; transition: 0.2s; }
        .logout-btn:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); color: #fca5a5; }
        .status-message { padding: 14px 18px; border-radius: 14px; margin-top: 25px; text-align: center; display: none; }
        .status-error { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .status-success { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .status-info { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
        .status-warning { background: rgba(245,158,11,0.15); color: #fde68a; border: 1px solid rgba(245,158,11,0.3); }
        .footer { text-align: center; margin-top: 35px; color: #64748b; font-size: 0.85rem; }
        .session-actions { display: flex; gap: 12px; margin-top: 15px; }
        .session-actions button { flex: 1; padding: 10px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-continue { background: #10b981; color: white; }
        .btn-disconnect { background: rgba(239,68,68,0.8); color: white; }
        .hidden { display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-dice"></i></div>
        <h1>LOTATO</h1>
        <p>JERE BòLET OU AK TOUT SEKIRITE</p>
    </div>

    <!-- Formulaire de connexion (caché si session active) -->
    <div id="login-form">
        <div class="form-group">
            <label><i class="fas fa-user-circle"></i> Identifiant</label>
            <input type="text" id="username" placeholder="Votre identifiant" autofocus>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="login-btn" id="login-btn"><i class="fas fa-sign-in-alt"></i> Connexion</button>
    </div>

    <!-- Message de session active (affiché à la place du formulaire si nécessaire) -->
    <div id="session-active-panel" class="hidden">
        <div class="status-message status-warning" style="display: block; margin-bottom: 20px;">
            <i class="fas fa-user-check"></i> Une session active a été détectée.
        </div>
        <div id="session-user-info" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; margin-bottom: 20px;">
            <!-- Infos utilisateur chargées dynamiquement -->
        </div>
        <div class="session-actions">
            <button id="continue-session-btn" class="btn-continue"><i class="fas fa-arrow-right"></i> Continuer</button>
            <button id="logout-session-btn" class="btn-disconnect"><i class="fas fa-sign-out-alt"></i> Se déconnecter</button>
        </div>
    </div>

    <div id="status-message" class="status-message"></div>
    <div class="footer"><p>© 2024 Lotato System | Version 5.0</p></div>
</div>

<script>
const API_BASE = '';

function showStatus(msg, type) {
    const el = document.getElementById('status-message');
    el.textContent = msg;
    el.className = `status-message status-${type}`;
    el.style.display = 'block';
}
function hideStatus() { document.getElementById('status-message').style.display = 'none'; }

async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showStatus('Veuillez remplir tous les champs', 'error'); return; }
    showStatus('Connexion en cours...', 'info');
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (data.success) {
            localStorage.setItem('lotato_token', data.token);
            localStorage.setItem('lotato_user', JSON.stringify(data.user));
            showStatus('Connexion réussie ! Redirection...', 'success');
            setTimeout(() => { window.location.href = data.redirectUrl; }, 500);
        } else {
            showStatus(data.error || 'Identifiants incorrects', 'error');
        }
    } catch (error) {
        showStatus('Erreur de connexion au serveur', 'error');
    }
}

// Déconnexion complète
async function logout(redirectAfter = true) {
    const token = localStorage.getItem('lotato_token');
    if (token) {
        // Appel optionnel au serveur pour invalider le token (si votre API le supporte)
        try {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch(e) { /* ignore errors */ }
    }
    localStorage.removeItem('lotato_token');
    localStorage.removeItem('lotato_user');
    if (redirectAfter) {
        showStatus('Déconnexion effectuée. Vous pouvez vous reconnecter.', 'success');
        setTimeout(() => window.location.reload(), 1000);
    }
}

// Calcul de l'URL de redirection selon le rôle de l'utilisateur
function getRedirectUrl(user) {
    if (user.role === 'supervisor') return user.level === 1 ? '/control-level1.html' : '/control-level2.html';
    if (user.role === 'subsystem') return '/subsystem-admin.html';
    if (user.role === 'master') return '/master-dashboard.html';
    return '/lotato.html';
}

// Vérification de session existante
async function checkExistingSession() {
    const token = localStorage.getItem('lotato_token');
    if (!token) return false;

    try {
        const response = await fetch('/api/auth/check', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        if (data.success && data.user) {
            // Session valide : on affiche le panneau de choix au lieu de rediriger automatiquement
            const user = data.user;
            document.getElementById('login-form').classList.add('hidden');
            const panel = document.getElementById('session-active-panel');
            panel.classList.remove('hidden');

            // Afficher les infos utilisateur
            const infoDiv = document.getElementById('session-user-info');
            infoDiv.innerHTML = `
                <p><strong><i class="fas fa-user"></i> Utilisateur :</strong> ${user.username}</p>
                <p><strong><i class="fas fa-id-badge"></i> Rôle :</strong> ${user.role} ${user.level ? '(niveau '+user.level+')' : ''}</p>
                <p><strong><i class="fas fa-clock"></i> Session active</strong></p>
            `;

            // Bouton "Continuer" -> redirige vers le tableau de bord
            document.getElementById('continue-session-btn').onclick = () => {
                const redirectUrl = getRedirectUrl(user);
                window.location.href = redirectUrl;
            };

            // Bouton "Se déconnecter" -> supprime la session et recharge la page pour afficher le formulaire
            document.getElementById('logout-session-btn').onclick = async () => {
                await logout(true);
            };
            return true;
        } else {
            // Token invalide, on le supprime
            localStorage.removeItem('lotato_token');
            localStorage.removeItem('lotato_user');
            return false;
        }
    } catch (error) {
        console.error('Erreur vérification session:', error);
        return false;
    }
}

// Initialisation : vérifier la session avant d'afficher le formulaire classique
(async function init() {
    const hasActiveSession = await checkExistingSession();
    if (!hasActiveSession) {
        // Aucune session active : afficher le formulaire normal
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('session-active-panel').classList.add('hidden');
    }
    // Attacher les événements du formulaire (même s'il est masqué, on les garde pour quand il sera réaffiché après déco)
    document.getElementById('login-btn').addEventListener('click', login);
    const pwdInput = document.getElementById('password');
    if (pwdInput) pwdInput.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    const userInput = document.getElementById('username');
    if (userInput) userInput.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
})();
</script>
</body>
</html>
