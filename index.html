<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotato — Connexion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand: #f39c12;
      --brand2: #e67e22;
      --danger: #e74c3c;
      --success: #27ae60;
      --info: #3498db;
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card-bg: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    /* Logo */
    .brand { text-align: center; margin-bottom: 36px; }
    .brand-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      border-radius: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 2rem; color: white;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(243,156,18,0.35);
    }
    .brand h1 {
      font-size: 2.4rem; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }

    /* Form */
    .field { margin-bottom: 20px; }
    .field label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
    .field label i { color: var(--brand); font-size: 0.85rem; }
    .field input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.06); border: 1.5px solid var(--border);
      border-radius: 12px; color: white; font-size: 1rem;
      outline: none; transition: border-color .2s, background .2s;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-color: var(--brand); background: rgba(255,255,255,0.10); }

    .btn-login {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: white; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 8px; letter-spacing: 0.5px;
      transition: opacity .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover  { opacity: .9; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* Alertes */
    .alert {
      padding: 13px 16px; border-radius: 12px; margin-top: 20px;
      font-size: 0.9rem; display: none; align-items: center; gap: 10px;
    }
    .alert.show { display: flex; }
    .alert-error   { background: rgba(231,76,60,.15);  color: #fca5a5; border: 1px solid rgba(231,76,60,.3); }
    .alert-success { background: rgba(39,174,96,.15);  color: #6ee7b7; border: 1px solid rgba(39,174,96,.3); }
    .alert-info    { background: rgba(52,152,219,.15); color: #93c5fd; border: 1px solid rgba(52,152,219,.3); }

    /* Changement de compte */
    .switch-account { text-align: center; margin-top: 24px; display: none; }
    .switch-account a {
      color: var(--brand); font-size: 0.85rem; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .switch-account a:hover { text-decoration: underline; }

    .footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-dice"></i></div>
    <h1>LOTATO</h1>
    <p>Jere bòlet ou ak tout sekirite</p>
  </div>

  <div class="field">
    <label for="username"><i class="fas fa-user"></i> Identifiant</label>
    <input type="text" id="username" placeholder="Votre identifiant" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="login-btn">
    <i class="fas fa-sign-in-alt"></i> Connexion
  </button>

  <div class="alert alert-error" id="alert-error"><i class="fas fa-times-circle"></i> <span id="alert-msg"></span></div>
  <div class="alert alert-success" id="alert-success"><i class="fas fa-check-circle"></i> Connexion réussie, redirection…</div>
  <div class="alert alert-info" id="alert-info"><i class="fas fa-spinner fa-spin"></i> Connexion en cours…</div>

  <div class="switch-account" id="switch-account">
    <a id="switch-link"><i class="fas fa-exchange-alt"></i> Changer de compte / Déconnexion</a>
  </div>

  <p class="footer">© 2024 Lotato System — Version 6.0</p>
</div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  function showAlert(type, msg) {
    ['error', 'success', 'info'].forEach(t => {
      const el = $('alert-' + t);
      el.classList.remove('show');
    });
    if (type === 'error') $('alert-msg').textContent = msg;
    $('alert-' + type).classList.add('show');
  }

  function hideAlerts() {
    ['error', 'success', 'info'].forEach(t => $('alert-' + t).classList.remove('show'));
  }

  async function login() {
    const username = $('username').value.trim();
    const password = $('password').value;
    if (!username || !password) { showAlert('error', 'Veuillez remplir tous les champs'); return; }

    $('login-btn').disabled = true;
    showAlert('info');

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('lotato_token', data.token);
        localStorage.setItem('lotato_user',  JSON.stringify(data.user));
        showAlert('success');
        setTimeout(() => { window.location.href = data.redirectUrl; }, 600);
      } else {
        showAlert('error', data.error || 'Identifiants incorrects');
        $('login-btn').disabled = false;
      }
    } catch {
      showAlert('error', 'Impossible de contacter le serveur');
      $('login-btn').disabled = false;
    }
  }

  function clearSession() {
    localStorage.removeItem('lotato_token');
    localStorage.removeItem('lotato_user');
    $('switch-account').style.display = 'none';
    $('username').value = '';
    $('password').value = '';
    $('username').focus();
    showAlert('info');
    setTimeout(hideAlerts, 1500);
  }

  // Afficher le lien de changement de compte si un token existe
  if (localStorage.getItem('lotato_token')) {
    $('switch-account').style.display = 'block';
  }

  $('login-btn').addEventListener('click', login);
  $('password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
  $('username').addEventListener('keypress', e => { if (e.key === 'Enter') $('password').focus(); });
  $('switch-link').addEventListener('click', clearSession);
})();
</script>
</body>
</html>
