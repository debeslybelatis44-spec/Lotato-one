<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Lotato - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0B1120 0%, #111827 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: 0.2s;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #F59E0B, #EA580C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #F59E0B, #F97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #9CA3AF;
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #E5E7EB;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #1F2937;
            border: 1.5px solid #374151;
            border-radius: 20px;
            color: #F9FAFB;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            padding-right: 45px;
        }

        .input-group input:focus {
            border-color: #F59E0B;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #9CA3AF;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #F59E0B;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #F59E0B, #EA580C);
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(234, 88, 12, 0.25);
        }

        .login-btn:hover {
            transform: scale(1.01);
            background: linear-gradient(95deg, #FBBF24, #F97316);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            padding: 12px 16px;
            border-radius: 28px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            display: none;
        }

        .status-error {
            background: rgba(220, 38, 38, 0.15);
            color: #FECACA;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .status-success {
            background: rgba(16, 185, 129, 0.15);
            color: #A7F3D0;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-info {
            background: rgba(59, 130, 246, 0.15);
            color: #BFDBFE;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.7rem;
            color: #4B5563;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }
            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-dice-d6"></i></div>
        <h1>LOTATO</h1>
        <p>JERE BòLET OU AK SEKIRITE</p>
    </div>

    <div class="form-group">
        <label><i class="fas fa-user"></i> Identifiant</label>
        <input type="text" id="username" placeholder="Nom d'utilisateur ou email" autocomplete="off">
    </div>
    <div class="form-group">
        <label><i class="fas fa-lock"></i> Mot de passe</label>
        <div class="input-group">
            <input type="password" id="password" placeholder="••••••••">
            <button type="button" class="toggle-password" id="togglePasswordBtn" tabindex="-1">
                <i class="fas fa-eye-slash"></i>
            </button>
        </div>
    </div>
    <button class="login-btn" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Connexion
    </button>

    <div id="statusMessage" class="status-message"></div>
    <div class="footer">
        <p>© 2025 Lotato System | v5.2</p>
    </div>
</div>

<script>
    // Éléments DOM
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const statusDiv = document.getElementById('statusMessage');
    const toggleBtn = document.getElementById('togglePasswordBtn');

    // Gestion affichage mot de passe
    let passwordVisible = false;
    toggleBtn.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordEl.type = passwordVisible ? 'text' : 'password';
        toggleBtn.innerHTML = passwordVisible ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    // Fonctions UI
    function showStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = `status-message status-${type}`;
        statusDiv.style.display = 'block';
        if (type !== 'error') {
            // Efface auto après 3s pour les infos/succès
            setTimeout(() => {
                if (statusDiv.style.display === 'block') hideStatus();
            }, 3000);
        }
    }

    function hideStatus() {
        statusDiv.style.display = 'none';
    }

    // Réinitialiser le bouton après tentative
    function resetLoginButton() {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Connexion';
    }

    // Nettoyage session (token invalide)
    function clearSession() {
        localStorage.removeItem('lotato_token');
        localStorage.removeItem('lotato_user');
    }

    // Redirection selon rôle (fallback si serveur ne renvoie pas redirectUrl)
    function getRedirectUrl(user) {
        if (!user || !user.role) return '/lotato.html';
        if (user.role === 'supervisor') {
            return user.level === 1 ? '/control-level1.html' : '/control-level2.html';
        } else if (user.role === 'subsystem') {
            return '/subsystem-admin.html';
        } else if (user.role === 'master') {
            return '/master-dashboard.html';
        }
        return '/lotato.html';
    }

    // Fonction de connexion
    async function performLogin() {
        const username = usernameEl.value.trim();
        const password = passwordEl.value;

        if (!username || !password) {
            showStatus('Veuillez remplir tous les champs', 'error');
            return;
        }

        // Désactiver bouton et montrer chargement
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connexion...';
        hideStatus();

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success && data.token) {
                // Succès : stocker token et user
                localStorage.setItem('lotato_token', data.token);
                localStorage.setItem('lotato_user', JSON.stringify(data.user));
                showStatus('Connexion réussie ! Redirection...', 'success');

                // Redirection après court délai
                const redirect = data.redirectUrl || getRedirectUrl(data.user);
                setTimeout(() => {
                    window.location.href = redirect;
                }, 500);
            } else {
                // Échec : nettoyer session corrompue
                clearSession();
                showStatus(data.error || 'Identifiants incorrects', 'error');
                resetLoginButton();
            }
        } catch (error) {
            console.error('Erreur réseau:', error);
            showStatus('Erreur de connexion au serveur. Vérifiez votre réseau.', 'error');
            resetLoginButton();
        }
    }

    // Gestion du clic et touche Entrée
    loginBtn.addEventListener('click', performLogin);
    passwordEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performLogin();
    });
    usernameEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') passwordEl.focus();
    });

    // === CORRECTION DU BUG DE REDIRECTION AUTOMATIQUE ===
    // On vérifie la session existante mais SANS REDIRIGER automatiquement.
    // On supprime uniquement les tokens invalides, et on ne fait rien d'autre.
    (async function checkSessionWithoutRedirect() {
        const token = localStorage.getItem('lotato_token');
        if (!token) return;

        try {
            const response = await fetch('/api/auth/check', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (!data.success) {
                // Token invalide ou expiré : on le nettoie
                clearSession();
                console.log("Session expirée, token supprimé.");
            } else {
                // Session valide mais on ne redirige pas !
                // On peut juste pré-remplir le champ identifiant pour aider
                if (data.user && data.user.username) {
                    usernameEl.value = data.user.username;
                }
                // On affiche un message informatif (pas une redirection)
                showStatus(`Session existante pour ${data.user?.username || 'utilisateur'}. Entrez votre mot de passe pour vous connecter.`, 'info');
            }
        } catch (error) {
            console.warn("Erreur vérification session:", error);
            clearSession();
        }
    })();
</script>
</body>
</html>
