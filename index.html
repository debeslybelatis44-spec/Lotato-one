<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <title>Lotato - Connexion | Système sécurisé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(15, 23, 42, 1) 0%, rgba(2, 8, 23, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Effet de particules animées en arrière-plan */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(243, 156, 18, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: floatBackground 20s linear infinite;
            pointer-events: none;
        }

        @keyframes floatBackground {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-40px); }
        }

        .container {
            background: rgba(10, 20, 40, 0.65);
            backdrop-filter: blur(18px);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 2;
        }

        .container:hover {
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.6);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3.8rem;
            background: linear-gradient(145deg, #fbbf24, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
        }

        .logo h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFD966, #FF8C42, #F97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        .logo p {
            color: #a5b4fc;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255,255,240,0.05);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #e0e7ff;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .form-group label i {
            color: #f39c12;
            font-size: 1rem;
            width: 20px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 25, 50, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: #f1f5f9;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .form-group input:focus {
            border-color: #f39c12;
            background: rgba(25, 40, 70, 0.85);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(203, 213, 255, 0.4);
            font-weight: 400;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(105deg, #f39c12, #e67e22);
            border: none;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s;
            margin-top: 1rem;
            box-shadow: 0 10px 20px -5px rgba(230, 126, 34, 0.3);
        }

        .login-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #f5a623, #f97316);
            box-shadow: 0 15px 25px -8px rgba(243, 156, 18, 0.5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .status-message {
            padding: 14px 18px;
            border-radius: 40px;
            margin-top: 25px;
            text-align: center;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .status-error {
            background: rgba(220, 38, 38, 0.2);
            color: #ffc4c4;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .status-success {
            background: rgba(16, 185, 129, 0.2);
            color: #bbf7d0;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .status-info {
            background: rgba(59, 130, 246, 0.2);
            color: #bfdbfe;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #5b6e9c;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.5rem;
        }

        /* Sécurité: indice de session */
        .session-badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            margin-top: 10px;
            color: #94a3b8;
        }

        button:disabled {
            opacity: 0.65;
            transform: none;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 1.8rem 1.5rem; }
            .logo h1 { font-size: 2.2rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-dice-d6"></i></div>
        <h1>LOTATO</h1>
        <p><i class="fas fa-shield-alt"></i> PLATFORM SEKIRISÉ</p>
    </div>

    <div class="form-group">
        <label><i class="fas fa-envelope"></i> Non itilizatè / Imèl</label>
        <input type="text" id="username" placeholder="admin@lotato.com ou non itilizatè" autocomplete="off">
    </div>
    <div class="form-group">
        <label><i class="fas fa-key"></i> Modpas</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="login-btn" id="login-btn"><i class="fas fa-arrow-right-to-bracket"></i> Konekte</button>

    <div id="status-message" class="status-message"></div>
    <div class="footer">
        <p><i class="far fa-clock"></i> Sesyon otomatik ekspire | Vèsyon 5.2</p>
    </div>
</div>

<script>
    const API_BASE = '';

    // Fonctions UI
    function showStatus(msg, type) {
        const el = document.getElementById('status-message');
        if (!el) return;
        el.textContent = msg;
        el.className = `status-message status-${type}`;
        el.style.display = 'block';
        // Auto hide après 5 sec pour erreur/info (optionnel)
        if (type === 'error' || type === 'info') {
            setTimeout(() => {
                if (el.style.display === 'block') hideStatus();
            }, 4000);
        }
    }
    function hideStatus() {
        const el = document.getElementById('status-message');
        if (el) el.style.display = 'none';
    }

    // Nettoie TOUTES les données de session (déconnexion explicite)
    function purgeSessionAndRedirectToLogin() {
        localStorage.removeItem('lotato_token');
        localStorage.removeItem('lotato_user');
        sessionStorage.removeItem('lotato_skip_redirect'); // drapeau de sécurité
        // On n'appelle pas window.location pour éviter boucle, mais on reset juste
    }

    // Redirection selon rôle (identique à votre logique)
    function getRedirectByRole(user) {
        if (!user || !user.role) return '/lotato.html';
        if (user.role === 'supervisor') {
            return user.level === 1 ? '/control-level1.html' : '/control-level2.html';
        } else if (user.role === 'subsystem') {
            return '/subsystem-admin.html';
        } else if (user.role === 'master') {
            return '/master-dashboard.html';
        } else {
            return '/lotato.html';
        }
    }

    // Vérification de session ultra stricte: on bloque la redirection auto non désirée
    // ET on impose que l'utilisateur ait cliqué sur "Se déconnecter" précédemment ou que token soit invalide
    // Le problème initial était: "même si tu viens de connecter, quand tu reviens, il redirige sans attendre"
    // SOLUTION : On force une vérification explicite, mais si la page est chargée directement, 
    // on demande un nouveau mot de passe si l'utilisateur a quitté sans logout?
    // Pour éviter redir intempestive on va permettre la redirection SEULEMENT si l'utilisateur a activement choisi de rester connecté ?
    // Nouveau comportement: Au chargement de la page de login, on NETTOIE automatiquement la session si un flag de "logout" n'est pas présent
    // Idée: On ajoute un flag sessionStorage "stay_logged_in" qui est supprimé lors d'une déconnexion volontaire.
    // Mais pour répondre au besoin "quand tu reviens il n'attend pas que tu remettes le mot de passe" => On va simplement DÉSACTIVER la redirection automatique sauf si l'utilisateur a explicitement coché "Se souvenir de moi" ? 
    // Ou beaucoup plus simple: SUPPRIMER complètement la vérification automatique de session sur la page login. Car ce n'est pas le rôle de la page login de faire une redirection.
    // Une page de login doit rester neutre, et si l'utilisateur a déjà un token il pourra se connecter mais on ne redirige plus automatiquement.
    // Pourtant, parfois une redirection automatique peut être utile si l'utilisateur revient après avoir fermé l'onglet sans se déconnecter ? Mais le client dit "ce n'est pas bon" donc je retire complètement la redirection auto.
    // Je vais supprimer le bloc qui redirige sans son consentement. La page login reste statique, si token existe on affiche un message mais l'utilisateur doit cliquer "Connexion" ou un bouton "Continuer" ?
    // Meilleure pratique: Offrir un choix: "Session existante, voulez-vous continuer?" mais le cahier des charges: il ne doit pas rediriger immédiatement.
    // Je propose d'effacer la redirection auto, et à la place afficher une notification "Session trouvée. Cliquez sur Connexion pour vous reconnecter rapidement" et le formulaire sera prérempli ou pas.
    // Je ne veux aucun comportement magique.

    // Nouveau: on supprime le auto-redirect. On va simplement pré-remplir un message informatif et laisser l'utilisateur décider.
    // Mais aussi: si le token est invalide, on le supprime.

    async function checkSessionWithoutRedirect() {
        const token = localStorage.getItem('lotato_token');
        if (!token) return false;

        try {
            const response = await fetch('/api/auth/check', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success && data.user) {
                // Session valide mais on ne redirige pas automatiquement, on informe l'utilisateur
                const userName = data.user.username || data.user.email || 'utilisateur';
                showStatus(`👋 Bon retour ${userName} ! Entrez votre mot de passe pour continuer ou cliquez sur Connexion.`, 'info');
                // Optionnel: pré-remplir le champ identifiant pour confort
                const usernameInput = document.getElementById('username');
                if (usernameInput && !usernameInput.value) {
                    usernameInput.value = data.user.username || '';
                }
                return true;
            } else {
                // Token invalide ou expiré -> nettoyage
                purgeSessionAndRedirectToLogin();
                return false;
            }
        } catch (error) {
            console.warn("Erreur vérification session silencieuse:", error);
            purgeSessionAndRedirectToLogin();
            return false;
        }
    }

    // Fonction login modifiée: Avant de tenter login, on supprime l'ancienne session ? non on laisse l'API gérer.
    // On bloque les doubles clics et on assure la déconnexion d'ancien compte si besoin
    let isLoggingIn = false;
    async function performLogin() {
        if (isLoggingIn) return;
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showStatus('Veuillez remplir identifiant et mot de passe', 'error');
            return;
        }

        isLoggingIn = true;
        const loginBtn = document.getElementById('login-btn');
        const originalText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connexion...';
        loginBtn.disabled = true;
        hideStatus();

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (data.success && data.token) {
                // Important : On écrase l'ancienne session (supprime tout)
                localStorage.setItem('lotato_token', data.token);
                localStorage.setItem('lotato_user', JSON.stringify(data.user));
                // On ajoute un timestamp pour éviter les ghosts
                sessionStorage.setItem('lotato_login_timestamp', Date.now().toString());
                showStatus('✅ Connexion réussie ! Redirection vers le tableau de bord...', 'success');
                setTimeout(() => {
                    const redirect = data.redirectUrl || getRedirectByRole(data.user);
                    window.location.href = redirect;
                }, 600);
            } else {
                // Si échec, nettoyer une éventuelle session corrompue
                purgeSessionAndRedirectToLogin();
                showStatus(data.error || 'Identifiants incorrects ou compte verrouillé', 'error');
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
                isLoggingIn = false;
            }
        } catch (error) {
            console.error('Login network error:', error);
            showStatus('Erreur réseau / serveur indisponible', 'error');
            loginBtn.innerHTML = originalText;
            loginBtn.disabled = false;
            isLoggingIn = false;
        }
    }

    // Bouton logout manuel amélioré? Pour permettre à l'utilisateur de clear sa session depuis cette page s'il le souhaite.
    function addLogoutHelper() {
        // Ajout d'un petit lien "Réinitialiser session" discrètement dans le footer sans overcharge UI
        const footerDiv = document.querySelector('.footer');
        if (footerDiv && !document.getElementById('reset-session-link')) {
            const resetLink = document.createElement('div');
            resetLink.style.marginTop = '12px';
            resetLink.style.fontSize = '0.7rem';
            resetLink.innerHTML = '<a href="#" id="force-logout-link" style="color:#94a3b8; text-decoration:none;"><i class="fas fa-trash-alt"></i> Réinitialiser la session et effacer les données</a>';
            footerDiv.appendChild(resetLink);
            document.getElementById('force-logout-link')?.addEventListener('click', (e) => {
                e.preventDefault();
                purgeSessionAndRedirectToLogin();
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                showStatus('Session effacée. Vous pouvez vous connecter avec un nouveau compte.', 'success');
                hideStatus();
                setTimeout(() => hideStatus(), 3000);
            });
        }
    }

    // NOUVEAU comportement : au chargement, on vérifie la session sans rediriger automatiquement
    // Mais si le token existe, on affiche simplement un message d'information.
    // Et on donne la possibilité de se reconnecter proprement.
    // Ainsi, l'utilisateur n'est JAMAIS forcé à aller vers l'ancien compte.
    // Il doit taper son mot de passe (ou changer l'identifiant) pour se connecter.
    // De plus, on ajoute un mécanisme pour que si le token est invalide, il soit supprimé.
    (async function initLoginPage() {
        // Étape 1: Nettoyer les éventuelles redirections pendantes (ancien bug)
        // On s'assure qu'aucun timeout ou interval ne redirige
        // On retire tout localStorage flag suspect
        const token = localStorage.getItem('lotato_token');
        if (token) {
            // On teste la validité du token mais toujours sans redirection
            await checkSessionWithoutRedirect();
        } else {
            // Aucune session, on est clean
            console.log("Page de connexion: aucune session existante");
        }

        // Ajoute le petit helper "effacer session"
        addLogoutHelper();

        // Écouteurs d'événements
        const loginBtn = document.getElementById('login-btn');
        const passwordField = document.getElementById('password');
        const usernameField = document.getElementById('username');

        if (loginBtn) loginBtn.addEventListener('click', performLogin);
        if (passwordField) {
            passwordField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performLogin();
            });
        }
        if (usernameField) {
            usernameField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') passwordField?.focus();
            });
        }

        // Suppression de toute tentative de redirection non sollicitée
        // On garantit aussi que si l'utilisateur revient via le bouton retour du navigateur,
        // aucun script ne lui impose une redirection vers le dashboard sans son accord.
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                // Même en cas de BFCache, on réinitialise le statut UI sans redirection auto
                hideStatus();
                const pwdField = document.getElementById('password');
                if (pwdField) pwdField.value = ''; // on force la remise du mot de passe pour sécurité
            }
        });
    })();

    // Bonus: protège contre une exfiltration de session non voulue (double contrôle)
    // Si jamais un script tiers essaye de forcer une redirection vers un dashboard, on bloque?
    // Optionnel: on peut intercepter les assignations de location? Non, trop intrusif.
    // Mais on a déjà enlevé tout setTimeout de redirection non autorisée. Seule la fonction performLogin
    // après succès provoque une redirection.
</script>
</body>
</html>
