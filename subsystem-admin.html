<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Propriétaire</title>
</head>
<body>
    <h1>Test Propriétaire</h1>
    <div id="result">Chargement...</div>
    <script>
        const token = localStorage.getItem('lotato_token');
        if (!token) {
            document.getElementById('result').innerHTML = 'Aucun token. <a href="/index.html">Se connecter</a>';
        } else {
            fetch('/api/auth/check', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('result').innerHTML = `
                        <p>✅ Authentifié</p>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('result').innerHTML = `❌ Échec: ${data.error}`;
                }
            })
            .catch(err => {
                document.getElementById('result').innerHTML = `❌ Erreur: ${err.message}`;
            });
        }
    </script>
</body>
</html>
